<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>去水印小程序后台管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/element-plus"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen">
  <div id="app">
    <!-- 登录视图 -->
    <div v-if="!isLoggedIn" class="min-h-screen flex items-center justify-center p-4">
      <div class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-gradient-to-tr from-emerald-500 to-teal-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/20">
            <i class="fa-solid fa-mobile-screen text-2xl text-white"></i>
          </div>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">小程序管理后台</h1>
          <p class="text-slate-400 text-sm mt-1">控制小程序标题、API Key、流量主广告与功能</p>
        </div>

        <form @submit.prevent="handleLogin" class="space-y-6">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">后台管理密码</label>
            <input
              type="password"
              v-model="loginPassword"
              placeholder="请输入管理员密码"
              class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
              required
            />
          </div>
          <button
            type="submit"
            :disabled="loginLoading"
            class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-semibold rounded-xl hover:opacity-95 transition-all shadow-lg shadow-emerald-500/25"
          >
            {{ loginLoading ? '验证中...' : '进入管理系统' }}
          </button>
        </form>
      </div>
    </div>

    <!-- 管理后台界面 -->
    <div v-else class="min-h-screen flex flex-col">
      <header class="glass-card sticky top-0 z-40 px-6 py-4 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-tr from-emerald-500 to-teal-500 rounded-xl flex items-center justify-center text-white font-bold shadow-md">
            <i class="fa-solid fa-sliders"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg text-white">小程序系统设置后台</h1>
            <span class="text-xs text-emerald-400 font-mono">Mini-Program Admin</span>
          </div>
        </div>
        <button @click="logout" class="px-3 py-1.5 text-xs text-slate-400 hover:text-rose-400 border border-slate-800 rounded-lg">退出登录</button>
      </header>

      <main class="flex-1 p-6 max-w-5xl mx-auto w-full space-y-6">
        <form @submit.prevent="saveConfig" class="space-y-6">

          <!-- 卡片 1: API 接口与 Key 设置 -->
          <div class="glass-card p-6 rounded-2xl space-y-4">
            <h2 class="text-base font-semibold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
              <i class="fa-solid fa-server text-emerald-400"></i> 去水印解析 API 接口设置
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">解析 API 服务地址 (固定端)</label>
                <input type="text" v-model="form.parse_api_url" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:border-emerald-500" required />
                <span class="text-[11px] text-slate-500">示例：https://shortvideo.aihubzone.cn/api/parse</span>
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">我的 API Key (付费购买的 Key)</label>
                <input type="text" v-model="form.api_key" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white font-mono focus:border-emerald-500" required />
                <span class="text-[11px] text-slate-500">用于调用 API 引擎解析视频</span>
              </div>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1.5">获取 / 订阅 API Key 跳转链接</label>
              <input type="text" v-model="form.subscribe_url" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:border-emerald-500" />
              <span class="text-[11px] text-slate-500">当 API Key 耗尽或用户点击“订阅 Key”时引导跳转的页面/客服说明</span>
            </div>
          </div>

          <!-- 卡片 2: 流量主与变现配置 -->
          <div class="glass-card p-6 rounded-2xl space-y-4">
            <h2 class="text-base font-semibold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
              <i class="fa-solid fa-rectangle-ad text-amber-400"></i> 流量主广告与每日免费额度
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">用户每日免费解析次数</label>
                <input type="number" v-model.number="form.daily_free_quota" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:border-emerald-500" />
                <span class="text-[11px] text-slate-500">用完后提示看激励视频广告获得更多次数</span>
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">激励视频广告位 ID (Unlock Ad)</label>
                <input type="text" v-model="form.ad_video_id" placeholder="adunit-xxxx" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white font-mono focus:border-emerald-500" />
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Banner 广告位 ID</label>
                <input type="text" v-model="form.ad_banner_id" placeholder="adunit-xxxx" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white font-mono focus:border-emerald-500" />
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">插屏广告位 ID</label>
                <input type="text" v-model="form.ad_interstitial_id" placeholder="adunit-xxxx" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white font-mono focus:border-emerald-500" />
              </div>
            </div>
          </div>

          <!-- 卡片 3: 小程序基础信息 -->
          <div class="glass-card p-6 rounded-2xl space-y-4">
            <h2 class="text-base font-semibold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
              <i class="fa-solid fa-mobile-screen-button text-cyan-400"></i> 小程序展示信息
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">小程序名称</label>
                <input type="text" v-model="form.mp_title" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:border-emerald-500" />
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">客服微信 / 联系方式</label>
                <input type="text" v-model="form.contact_wechat" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:border-emerald-500" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1.5">首页通告通知栏</label>
              <input type="text" v-model="form.mp_notice" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:border-emerald-500" />
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1.5">免责声明条款</label>
              <textarea v-model="form.disclaimer" rows="2" class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:border-emerald-500"></textarea>
            </div>
          </div>

          <!-- 保存按钮 -->
          <div class="flex justify-end">
            <button
              type="submit"
              :disabled="saving"
              class="px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold text-sm rounded-xl hover:opacity-95 transition-all shadow-lg shadow-emerald-500/25 flex items-center gap-2"
            >
              <i class="fa-solid fa-floppy-disk"></i> {{ saving ? '正在保存...' : '保存小程序配置' }}
            </button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;

    createApp({
      setup() {
        const isLoggedIn = ref(false);
        const loginPassword = ref('');
        const loginLoading = ref(false);
        const adminToken = ref(localStorage.getItem('mp_admin_token') || '');
        const saving = ref(false);

        const form = reactive({
          mp_title: '', mp_notice: '', parse_api_url: '', api_key: '',
          subscribe_url: '', daily_free_quota: 5, ad_banner_id: '',
          ad_video_id: '', ad_interstitial_id: '', contact_wechat: '', disclaimer: ''
        });

        async function handleLogin() {
          loginLoading.value = true;
          try {
            const res = await fetch('/api/admin/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: loginPassword.value }),
            });
            const data = await res.json();
            if (res.ok && data.code === 200) {
              adminToken.value = data.data.token;
              localStorage.setItem('mp_admin_token', adminToken.value);
              isLoggedIn.value = true;
              ElementPlus.ElMessage.success('登录成功！');
              fetchConfig();
            } else {
              ElementPlus.ElMessage.error(data.msg || '密码错误');
            }
          } catch (e) {
            ElementPlus.ElMessage.error('网络请求失败');
          } finally {
            loginLoading.value = false;
          }
        }

        function logout() {
          isLoggedIn.value = false;
          localStorage.removeItem('mp_admin_token');
        }

        async function fetchConfig() {
          const res = await fetch('/api/admin/config', {
            headers: { 'X-Admin-Token': adminToken.value }
          });
          const data = await res.json();
          if (data.code === 200) {
            Object.assign(form, data.data);
          }
        }

        async function saveConfig() {
          saving.value = true;
          try {
            const res = await fetch('/api/admin/config', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Admin-Token': adminToken.value
              },
              body: JSON.stringify(form)
            });
            const data = await res.json();
            if (data.code === 200) {
              ElementPlus.ElMessage.success('保存配置成功！');
            } else {
              ElementPlus.ElMessage.error(data.msg);
            }
          } catch (e) {
            ElementPlus.ElMessage.error('保存失败');
          } finally {
            saving.value = false;
          }
        }

        onMounted(() => {
          if (adminToken.value) {
            isLoggedIn.value = true;
            fetchConfig();
          }
        });

        return {
          isLoggedIn, loginPassword, loginLoading, saving, form,
          handleLogin, logout, saveConfig
        };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
