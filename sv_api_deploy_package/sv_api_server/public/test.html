<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SV-API 接口在线测试工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
        🎬 SV-API 接口测试工具
      </h1>
      <p class="text-sm text-slate-400">去水印短视频/图集解析 · 自动正文链接提取 · Node.js 服务端</p>
    </div>

    <!-- Key 说明 -->
    <div class="glass-card p-4 rounded-xl border-l-4 border-l-cyan-500 text-xs text-slate-300 flex items-center justify-between">
      <div>
        内置测试 Key：<code class="bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded font-mono" id="testKey">sk_test_00000000000000000000000000000001</code>
        （不限次数，永不过期）
      </div>
      <button onclick="copyTestKey()" class="text-cyan-400 hover:underline flex items-center gap-1">
        <i class="fa-regular fa-copy"></i> 复制 Key
      </button>
    </div>

    <!-- 配置与测试卡片 -->
    <div class="glass-card p-6 rounded-2xl space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">API Base URL</label>
          <input type="text" id="baseUrl" value="http://localhost:3000" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">API Key</label>
          <input type="text" id="apiKey" value="sk_test_00000000000000000000000000000001" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500 font-mono" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">分享文本 / 视频链接</label>
        <textarea
          id="rawInput"
          rows="3"
          placeholder="可直接粘贴抖音、快手、小红书等 App 复制的完整分享文字（程序会自动抓取其中的 http/https 链接）..."
          class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
        ></textarea>
      </div>

      <button
        id="submitBtn"
        onclick="doParse()"
        class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-indigo-500 text-white font-bold rounded-xl hover:opacity-95 transition-all shadow-lg shadow-cyan-500/25 flex items-center justify-center gap-2"
      >
        <i class="fa-solid fa-wand-magic-sparkles"></i> 立即解析
      </button>
    </div>

    <!-- 状态与结果 -->
    <div id="resultCard" class="glass-card p-6 rounded-2xl hidden space-y-4">
      <div id="statusBar"></div>
      <div id="mediaOutput"></div>

      <button onclick="toggleJson()" class="text-xs text-slate-500 hover:text-slate-300 flex items-center gap-1 border border-slate-800 px-3 py-1.5 rounded-lg">
        <i class="fa-solid fa-code"></i> <span id="jsonBtnText">显示原始 JSON 响应</span>
      </button>
      <pre id="jsonOutput" class="hidden bg-slate-900 p-4 rounded-xl text-xs font-mono text-slate-300 overflow-x-auto border border-slate-800"></pre>
    </div>
  </div>

  <script>
    // 自动适配 Base URL
    if (window.location.origin && window.location.origin !== 'file://') {
      document.getElementById('baseUrl').value = window.location.origin;
    }

    function copyTestKey() {
      const key = document.getElementById('testKey').innerText;
      navigator.clipboard.writeText(key).then(() => alert('已复制测试 Key！'));
    }

    let showRaw = false;
    function toggleJson() {
      showRaw = !showRaw;
      document.getElementById('jsonOutput').classList.toggle('hidden', !showRaw);
      document.getElementById('jsonBtnText').innerText = showRaw ? '隐藏原始 JSON 响应' : '显示原始 JSON 响应';
    }

    async function doParse() {
      const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
      const apiKey  = document.getElementById('apiKey').value.trim();
      const rawText = document.getElementById('rawInput').value.trim();

      if (!baseUrl || !apiKey || !rawText) {
        alert('请填写完整信息'); return;
      }

      const btn = document.getElementById('submitBtn');
      const resultCard = document.getElementById('resultCard');
      const statusBar  = document.getElementById('statusBar');
      const mediaOutput = document.getElementById('mediaOutput');
      const jsonOutput = document.getElementById('jsonOutput');

      resultCard.classList.remove('hidden');
      statusBar.innerHTML = `<div class="p-3 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 rounded-xl text-xs flex items-center gap-2"><i class="fa-solid fa-spinner animate-spin"></i> 正在请求解析中，请稍候...</div>`;
      mediaOutput.innerHTML = '';
      jsonOutput.innerText = '';
      btn.disabled = true;

      try {
        const targetApi = `${baseUrl}/api/parse?url=${encodeURIComponent(rawText)}&api_key=${encodeURIComponent(apiKey)}`;
        const res = await fetch(targetApi);
        const data = await res.json();

        jsonOutput.innerText = JSON.stringify(data, null, 2);

        if (res.ok && (data.code === 200 || data.code === 0)) {
          statusBar.innerHTML = `<div class="p-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-xl text-xs flex items-center gap-2"><i class="fa-solid fa-circle-check"></i> 解析成功！</div>`;
          renderMedia(data);
        } else {
          statusBar.innerHTML = `<div class="p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-xl text-xs flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> 接口错误: ${data.msg || '解析失败'} (code: ${data.code})</div>`;
        }
      } catch (err) {
        statusBar.innerHTML = `<div class="p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-xl text-xs flex items-center gap-2"><i class="fa-solid fa-circle-xmark"></i> 请求失败: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderMedia(data) {
      const container = document.getElementById('mediaOutput');
      const d = data.data || data;

      const title = d.title || d.desc || '';
      const videoUrl = d.video_url || d.url || d.play_url || (d.video_urls && d.video_urls[0]) || '';
      const images = d.images || d.image_list || d.pic_list || [];

      let html = '';
      if (title) {
        html += `<p class="text-sm font-semibold text-slate-200 mb-3"><i class="fa-regular fa-file-lines text-cyan-400"></i> ${escapeHtml(title)}</p>`;
      }

      if (videoUrl) {
        html += `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 max-w-md space-y-3">
            <video controls src="${escapeHtml(videoUrl)}" class="w-full rounded-lg max-h-80 bg-black"></video>
            <a href="${escapeHtml(videoUrl)}" target="_blank" download class="inline-flex items-center gap-2 px-4 py-2 bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded-lg text-xs font-semibold hover:bg-cyan-500/30 transition-all">
              <i class="fa-solid fa-download"></i> 下载无水印视频
            </a>
          </div>`;
      } else if (images && images.length > 0) {
        html += `<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">`;
        images.forEach((img, idx) => {
          const src = typeof img === 'string' ? img : (img.url || img.url_list?.[0] || '');
          if (src) {
            html += `
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 space-y-2">
                <img src="${escapeHtml(src)}" class="w-full h-36 object-cover rounded-lg" />
                <a href="${escapeHtml(src)}" target="_blank" class="block text-center py-1 bg-cyan-500/10 text-cyan-400 text-xs rounded hover:bg-cyan-500/20">图片 ${idx+1} 下载</a>
              </div>`;
          }
        });
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
